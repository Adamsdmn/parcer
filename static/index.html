<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Радар — поиск клиентов для сайтов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0c; --panel:rgba(28,28,33,.78); --solid:#17171b; --raise:#202026;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.18);
  --text:#ececf2; --muted:#8c8c99; --white:#f2f2f6;
  --nosite:#ff8a3d; --socials:#a47bff; --template:#f4c531; --site:#3fcf8e;
  --wa:#25d366; --tg:#2aa3e0; --vk:#2f6fdb; --vb:#7360f2;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:500 14px/1.45 Onest,system-ui,sans-serif;color:var(--text);background:var(--bg);
  background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.2px);background-size:16px 16px;overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--white);outline-offset:2px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#34343c;border-radius:8px}

.app{display:grid;grid-template-columns:76px 340px 1fr;height:100vh;gap:12px;padding:12px}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(14px)}

/* rail */
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px}
.logo{width:42px;height:42px;border-radius:14px;background:var(--white);color:#0a0a0c;display:grid;place-items:center;font-weight:800;font-size:1.25rem;margin-bottom:10px}
.rbtn{width:60px;padding:9px 0 7px;border:1px solid transparent;border-radius:14px;background:none;cursor:pointer;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7rem;font-weight:600}
.rbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rbtn:hover{color:var(--text)}
.rbtn[aria-current=true]{background:var(--raise);border-color:var(--line2);color:var(--white)}

/* panel */
.panel{display:flex;flex-direction:column;overflow:hidden}
.p-scroll{flex:1;overflow:auto;padding:18px 16px 8px}
.p-title{font-weight:700;font-size:.95rem;display:flex;justify-content:space-between;align-items:center}
.p-sub{color:var(--muted);font-size:.8rem;margin:3px 0 10px}
.sec+.sec{margin-top:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:.82rem;font-weight:600}
.chip.rm{cursor:pointer}.chip.rm::after{content:"×";color:var(--muted);font-size:1rem;line-height:1}
.chip.rm:hover{border-color:var(--line2)}
.add{display:flex;gap:6px;margin-top:10px}
.add input{flex:1;min-width:0;background:var(--solid);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.add input:focus{outline:none;border-color:var(--line2)}
.add button,.icon-btn{width:38px;border:1px solid var(--line);background:var(--raise);border-radius:12px;cursor:pointer;font-size:1.1rem}
.add button:hover,.icon-btn:hover{border-color:var(--line2)}
.groups{margin-top:12px}
.gchip{background:var(--solid);border:1px solid var(--line);border-radius:12px;padding:6px 11px;font-size:.82rem;font-weight:600;cursor:pointer}
.gchip[aria-pressed=true]{background:var(--white);color:#0a0a0c;border-color:var(--white)}
.suggest{margin-top:12px;padding:10px;border:1px dashed var(--line2);border-radius:14px}
.sg{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.8rem;cursor:pointer;color:var(--text)}
.sg::before{content:"+ ";color:var(--muted)}
.sg:hover{border-color:var(--white)}.sg[disabled]{opacity:.35;cursor:default}
.p-foot{padding:12px 16px 16px;border-top:1px solid var(--line)}
.go{width:100%;border:0;border-radius:14px;background:var(--white);color:#0a0a0c;font-weight:700;padding:13px;cursor:pointer;font-size:.95rem}
.go:hover{filter:brightness(.92)}.go[disabled]{opacity:.5;cursor:wait}
.foot-note{color:var(--muted);font-size:.75rem;text-align:center;margin-top:8px}

/* main */
.main{display:flex;flex-direction:column;overflow:hidden}
.top{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tab{border:1px solid var(--line);background:var(--solid);border-radius:12px;padding:8px 14px;font-weight:700;cursor:pointer;color:var(--muted)}
.tab b{color:var(--text);margin-left:4px}
.tab[aria-pressed=true]{background:var(--raise);border-color:var(--line2);color:var(--white)}
.find{flex:1 1 220px;background:var(--solid);border:1px solid var(--line);border-radius:12px;padding:9px 14px;min-width:0}
.find:focus{outline:none;border-color:var(--line2)}
.sel{background:var(--solid);border:1px solid var(--line);border-radius:12px;padding:9px 10px;cursor:pointer}
.sel option{background:#1b1b20}
.btn2{background:var(--solid);border:1px solid var(--line);border-radius:12px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn2:hover{border-color:var(--line2)}
#toggle-panel{display:none}
.stat{padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
.sbtn{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:.82rem;color:var(--muted)}
.sbtn i{width:8px;height:8px;border-radius:50%;background:var(--c,#777)}
.sbtn[aria-pressed=true]{border-color:var(--line2);color:var(--white);background:var(--raise)}
.shown{margin-left:auto;color:var(--muted);font-size:.8rem}
.demo{background:var(--template);color:#2a2000;font-weight:700;border-radius:999px;padding:2px 10px;font-size:.75rem;margin-left:8px}
.scroll{flex:1;overflow:auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding-bottom:70px}

/* card */
.card{position:relative;background:var(--solid);border:1px solid var(--line);border-radius:18px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:7px;
  transition:border-color .15s,background .15s}
.card:hover{border-color:var(--line2);background:#1c1c21}
.card.picked{border-color:var(--white)}
.c-top{display:flex;align-items:center;gap:8px}
.chk{width:20px;height:20px;border-radius:7px;border:1.5px solid var(--line2);display:grid;place-items:center;cursor:pointer;flex:none}
.chk input{appearance:none;width:100%;height:100%;border-radius:6px;cursor:pointer;margin:0}
.chk input:checked{background:var(--white);box-shadow:inset 0 0 0 3px var(--solid)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.74rem;font-weight:700;
  color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.st-nosite{--c:var(--nosite)}.st-socials{--c:var(--socials)}.st-template{--c:var(--template)}.st-site{--c:var(--site)}
.rate{margin-left:auto;font-weight:800;font-size:.78rem;padding:3px 9px;border-radius:999px;background:var(--raise);border:1px solid var(--line2)}
.rate.hi{color:var(--site)}.rate.mid{color:var(--template)}.rate.lo{color:var(--nosite)}
.card h3{font-size:1.02rem;font-weight:700;line-height:1.25;margin-top:2px}
.c-cat{color:var(--muted);font-size:.82rem}
.c-addr{color:var(--muted);font-size:.82rem;display:flex;gap:5px}
.c-addr svg{width:13px;height:13px;flex:none;margin-top:3px;stroke:currentColor;fill:none;stroke-width:2}
.c-foot{display:flex;gap:6px;align-items:center;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.ct{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.64rem;font-weight:800;text-decoration:none;color:#fff;background:#3a3a44;border:1px solid rgba(255,255,255,.12)}
.ct:hover{filter:brightness(1.2)}
.ct-whatsapp{background:var(--wa)}.ct-telegram{background:var(--tg)}.ct-vkontakte{background:var(--vk)}.ct-viber{background:var(--vb)}
.ct-instagram{background:linear-gradient(45deg,#f9a03c,#e1306c,#833ab4)}.ct-facebook{background:#1877f2}
.rv-n{margin-left:auto;color:var(--muted);font-size:.78rem}
.skel{height:170px;border-radius:18px;background:linear-gradient(100deg,var(--solid) 30%,#24242b 50%,var(--solid) 70%);background-size:300% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-300% 0}}
.empty{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--muted)}
.empty h2{color:var(--text);font-size:1.15rem;margin-bottom:6px}

/* selection bar */
.selbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:none;gap:8px;align-items:center;background:var(--white);color:#0a0a0c;
  border-radius:16px;padding:8px 10px 8px 16px;box-shadow:0 14px 40px rgba(0,0,0,.6);z-index:20;font-weight:700}
.selbar.on{display:flex;animation:up .18s ease-out}
@keyframes up{from{transform:translate(-50%,12px);opacity:0}}
.selbar button{border:0;background:#0a0a0c;color:#fff;border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer}
.selbar button.l{background:#e4e4ea;color:#0a0a0c}

/* dialog */
dialog{border:1px solid var(--line2);border-radius:22px;padding:0;width:min(680px,calc(100% - 20px));max-height:92vh;background:#141418;color:var(--text);
  box-shadow:0 30px 90px rgba(0,0,0,.7)}
dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(4px)}
.d-in{padding:22px;overflow:auto;max-height:92vh;position:relative}
.d-x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--raise);cursor:pointer}
.d-in h2{font-size:1.4rem;font-weight:800;letter-spacing:-.01em;margin:10px 40px 4px 0}
.d-sec{margin-top:20px}
.d-sec h4{font-size:.78rem;color:var(--muted);font-weight:700;margin-bottom:8px}
.clist{display:flex;flex-direction:column;gap:6px}
.crow{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--text);padding:7px 10px;border:1px solid var(--line);border-radius:12px;background:var(--solid)}
.crow:hover{border-color:var(--line2)}
.crow .ct{width:26px;height:26px}
textarea{width:100%;min-height:128px;resize:vertical;background:var(--solid);border:1px solid var(--line);border-radius:14px;padding:12px;line-height:1.5}
textarea:focus{outline:none;border-color:var(--line2)}
.d-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.d-act .go{width:auto;padding:10px 18px;font-size:.88rem}
.d-act .btn2{padding:10px 16px}
.rv{padding:12px 0;border-top:1px solid var(--line)}
.rv-t{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.rv-t time{color:var(--muted);font-weight:500;font-size:.8rem}
.stars{color:var(--template);letter-spacing:1px}
.rv p{margin-top:3px;color:#cfcfd8;max-width:62ch}
.muted{color:var(--muted)}

@media(max-width:1000px){
  body{overflow:auto}
  .app{display:block;height:auto;padding:8px}
  .rail{flex-direction:row;justify-content:center;padding:8px;margin-bottom:8px}.logo{margin:0 10px 0 0}
  .panel{display:none;margin-bottom:8px;max-height:75vh}.panel.open{display:flex}
  .main{overflow:visible}.scroll{overflow:visible}
  #toggle-panel{display:block}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail glass" aria-label="Разделы">
    <div class="logo" aria-hidden="true">R</div>
    <button class="rbtn" data-tab="search" aria-current="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Поиск</button>
    <button class="rbtn" data-tab="base"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>База</button>
  </nav>

  <aside class="panel glass" id="panel">
    <div class="p-scroll">
      <div class="sec">
        <div class="p-title">Города</div>
        <div class="p-sub">Пишите по-русски. Можно несколько — результаты объединятся.</div>
        <div class="chips" id="city-chips"></div>
        <div class="add"><input id="city-in" list="cities" placeholder="Например, Павлодар…" autocomplete="off"><button id="city-add" aria-label="Добавить город">+</button></div>
        <datalist id="cities"><option>Павлодар<option>Астана<option>Алматы<option>Караганда<option>Шымкент<option>Актобе<option>Семей<option>Усть-Каменогорск<option>Костанай<option>Петропавловск<option>Экибастуз<option>Атырау<option>Актау<option>Тараз<option>Кокшетау</datalist>
      </div>
      <div class="sec">
        <div class="p-title">Категории</div>
        <div class="p-sub">Выберите сферу или впишите свою, например «барбершоп».</div>
        <div class="chips" id="cat-chips"></div>
        <div class="add"><input id="cat-in" placeholder="Например, пиццерия…" autocomplete="off"><button id="cat-add" aria-label="Добавить категорию">+</button></div>
        <div class="chips groups" id="groups"></div>
        <div class="suggest chips" id="suggest" hidden></div>
      </div>
    </div>
    <div class="p-foot">
      <button class="go" id="go">Найти</button>
      <div class="foot-note" id="combo"></div>
    </div>
  </aside>

  <section class="main glass">
    <div class="top">
      <button class="btn2" id="toggle-panel">Фильтры</button>
      <button class="tab" data-tab="search" aria-pressed="true">Поиск <b id="n-search">0</b></button>
      <button class="tab" data-tab="base" aria-pressed="false">База <b id="n-base">0</b></button>
      <input class="find" id="find" placeholder="Фильтр по названию, адресу, телефону…" aria-label="Фильтр по результатам">
      <select class="sel" id="sort" aria-label="Сортировка">
        <option value="rating">Рейтинг ↓</option><option value="reviews">Отзывы ↓</option><option value="name">А–Я</option>
      </select>
      <select class="sel" id="minr" aria-label="Минимальный рейтинг">
        <option value="0">Любой рейтинг</option><option value="3.5">от 3.5</option><option value="4">от 4.0</option><option value="4.5">от 4.5</option>
      </select>
      <button class="btn2" id="csv">CSV</button>
    </div>
    <div class="stat" id="stat"></div>
    <div class="scroll"><div class="grid" id="grid"></div></div>
  </section>
</div>

<div class="selbar" id="selbar">
  <span id="sel-n"></span>
  <button id="sel-add">В базу</button>
  <button id="sel-del" class="l">Убрать из базы</button>
  <button id="sel-csv" class="l">CSV</button>
  <button id="sel-clr" class="l" aria-label="Снять выбор">✕</button>
</div>

<dialog id="dlg"><div class="d-in" id="d-in"></div></dialog>

<script>
/* ================= данные ================= */
const GROUPS={
  "Еда и напитки":["ресторан","кафе","бар","пиццерия","суши","кофейня","пекарня","фастфуд","столовая"],
  "Красота":["салон красоты","барбершоп","парикмахерская","маникюр","косметолог","массаж"],
  "Медицина":["стоматология","клиника","аптека","ветеринарная клиника","лаборатория"],
  "Досуг":["компьютерный клуб","караоке","боулинг","кинотеатр","кальянная","квест","бильярд","лазертаг"],
  "Спорт":["фитнес","спортзал","бассейн","йога","единоборства","танцы"],
  "Авто":["автосервис","автомойка","шиномонтаж","автозапчасти","детейлинг"],
  "Обучение":["языковые курсы","репетитор","детский сад","автошкола","учебный центр"],
  "Магазины":["магазин одежды","цветы","магазин подарков","мебель","электроника","зоомагазин"],
  "Услуги":["юридические услуги","клининг","фотостудия","ремонт техники","типография","строительство"]
};
const ST={nosite:"Без сайта",socials:"Только соцсети",template:"Шаблон",site:"Есть сайт"};
const STC={nosite:"var(--nosite)",socials:"var(--socials)",template:"var(--template)",site:"var(--site)"};
const ICON={phone:"☎",whatsapp:"WA",telegram:"TG",instagram:"IG",vkontakte:"VK",viber:"Vb",facebook:"fb",email:"@",website:"www",youtube:"YT",link:"↗"};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const m=n%10;return n>10&&n<20?c:m>1&&m<5?b:m===1?a:c};

function loadBase(){try{return new Map(JSON.parse(localStorage.getItem("radar_base")||"[]").map(p=>[p.id,p]))}catch{return new Map()}}
function saveBase(){try{localStorage.setItem("radar_base",JSON.stringify([...state.base.values()]))}catch{}}

const state={
  cities:["Павлодар"],cats:["ресторан","компьютерный клуб"],
  places:[],demo:false,source:"",base:loadBase(),sel:new Set(),
  tab:"search",status:"all",text:"",minr:0,sort:"rating",group:null,ctl:null
};

/* ================= панель слева ================= */
function chipRow(el,arr,onRemove){
  el.innerHTML=arr.map((v,i)=>`<button class="chip rm" data-i="${i}" aria-label="Убрать ${esc(v)}">${esc(v)}</button>`).join("");
  el.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{arr.splice(+b.dataset.i,1);onRemove()});
}
function renderPanel(){
  chipRow($("#city-chips"),state.cities,renderPanel);
  chipRow($("#cat-chips"),state.cats,renderPanel);
  $("#groups").innerHTML=Object.keys(GROUPS).map(g=>`<button class="gchip" data-g="${esc(g)}" aria-pressed="${state.group===g}">${esc(g)}</button>`).join("");
  $("#groups").querySelectorAll(".gchip").forEach(b=>b.onclick=()=>{state.group=state.group===b.dataset.g?null:b.dataset.g;renderPanel()});
  const sg=$("#suggest");
  sg.hidden=!state.group;
  if(state.group)sg.innerHTML=GROUPS[state.group].map(c=>`<button class="sg" data-c="${esc(c)}" ${state.cats.includes(c)?"disabled":""}>${esc(c)}</button>`).join("");
  sg.querySelectorAll(".sg").forEach(b=>b.onclick=()=>{state.cats.push(b.dataset.c);renderPanel()});
  const n=state.cities.length*state.cats.length;
  $("#combo").textContent=n?`${state.cities.length} ${plural(state.cities.length,"город","города","городов")} × ${state.cats.length} ${plural(state.cats.length,"категория","категории","категорий")} = ${n} ${plural(n,"запрос","запроса","запросов")}`:"Добавьте город и категорию";
}
function addFrom(input,arr){
  const v=input.value.trim();
  if(v&&!arr.some(x=>x.toLowerCase()===v.toLowerCase()))arr.push(v);
  input.value="";renderPanel();
}
$("#city-add").onclick=()=>addFrom($("#city-in"),state.cities);
$("#cat-add").onclick=()=>addFrom($("#cat-in"),state.cats);
$("#city-in").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();addFrom(e.target,state.cities)}};
$("#cat-in").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();addFrom(e.target,state.cats)}};

/* ================= поиск ================= */
async function search(){
  if(!state.cities.length||!state.cats.length){$("#combo").textContent="Добавьте хотя бы один город и одну категорию";return}
  state.ctl?.abort();state.ctl=new AbortController();
  setTab("search");
  $("#go").disabled=true;$("#go").textContent="Ищем…";
  $("#grid").innerHTML='<div class="skel"></div>'.repeat(9);
  try{
    const r=await fetch(`/api/search?cities=${encodeURIComponent(state.cities.join("|"))}&cats=${encodeURIComponent(state.cats.join("|"))}`,{signal:state.ctl.signal});
    const j=await r.json();
    if(!r.ok)throw new Error(j.error||"Ошибка запроса");
    state.places=j.places||[];state.demo=j.demo;state.source=j.source;state.sel.clear();
    $("#panel").classList.remove("open");
  }catch(e){
    if(e.name==="AbortError")return;
    $("#grid").innerHTML=`<div class="empty"><h2>Не получилось загрузить</h2>${esc(e.message)}</div>`;
    $("#go").disabled=false;$("#go").textContent="Найти";return;
  }
  $("#go").disabled=false;$("#go").textContent="Найти";
  render();
}
$("#go").onclick=search;

/* ================= список ================= */
function currentList(){return state.tab==="base"?[...state.base.values()]:state.places}
function filtered(){
  const t=state.text.toLowerCase();
  return currentList().filter(p=>p.rating>=state.minr&&(!t||(p.name+" "+p.address+" "+(p.phone||"")+" "+p.category).toLowerCase().includes(t)));
}
function render(){
  const base=filtered();
  const counts={all:base.length,nosite:0,socials:0,template:0,site:0};
  base.forEach(p=>counts[p.status]++);
  let list=state.status==="all"?base:base.filter(p=>p.status===state.status);
  const s=state.sort;
  list=[...list].sort((a,b)=>s==="name"?a.name.localeCompare(b.name,"ru"):s==="reviews"?b.reviewCount-a.reviewCount:(b.rating-a.rating)||(b.reviewCount-a.reviewCount));
  state.view=list;
  const osm=state.source==="osm";
  $("#minr").hidden=osm;
  if(osm){state.minr=0;$("#minr").value="0";[...$("#sort").options].forEach(o=>{o.hidden=o.disabled=o.value!=="name"});if(state.sort!=="name"){state.sort="name";$("#sort").value="name"}}

  $("#n-search").textContent=state.places.length;
  $("#n-base").textContent=state.base.size;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-pressed",t.dataset.tab===state.tab));
  document.querySelectorAll(".rbtn").forEach(t=>t.setAttribute("aria-current",t.dataset.tab===state.tab));

  const chips=[["all","Все",counts.all,"#9a9aa6"],...Object.keys(ST).map(k=>[k,ST[k],counts[k],STC[k]])];
  $("#stat").innerHTML=chips.map(([k,l,n,c])=>`<button class="sbtn" data-s="${k}" style="--c:${c}" aria-pressed="${state.status===k}"><i></i>${l} ${n}</button>`).join("")
    +`<span class="shown">Показано ${list.length} из ${currentList().length}${state.tab==="search"?(state.demo?'<span class="demo">демо-данные</span>':osm?'<span class="demo" style="background:var(--raise);color:var(--muted);border:1px solid var(--line2)" title="В OpenStreetMap нет рейтинга и отзывов, а контакты заполнены не у всех — статус «Без сайта» нужно проверять вручную">OpenStreetMap</span>':""):""}</span>`;
  $("#stat").querySelectorAll(".sbtn").forEach(b=>b.onclick=()=>{state.status=b.dataset.s;render()});

  if(!list.length){
    $("#grid").innerHTML=state.tab==="base"&&!state.base.size
      ?'<div class="empty"><h2>База пуста</h2>Отметьте заведения галочкой и нажмите «В базу».</div>'
      :'<div class="empty"><h2>Ничего нет</h2>Выберите города и категории слева и нажмите «Найти» или ослабьте фильтры.</div>';
  }else{
    $("#grid").innerHTML=list.map(cardHTML).join("");
  }
  renderSelbar();
}
function tiles(p,all){
  const seen=new Set(),out=[];
  for(const c of p.contacts||[]){
    if(!all&&seen.has(c.type))continue;seen.add(c.type);
    out.push(c);
  }
  return out;
}
const rateCls=r=>r>=4.5?"hi":r>=4?"mid":"lo";
function cardHTML(p){
  const t=tiles(p).slice(0,7).map(c=>`<a class="ct ct-${esc(c.type)}" href="${esc(c.url)}" target="_blank" rel="noopener" title="${esc(c.text||c.type)}">${ICON[c.type]||"↗"}</a>`).join("");
  return `<article class="card ${state.sel.has(p.id)?"picked":""}" data-id="${esc(p.id)}">
    <div class="c-top">
      <label class="chk" title="Выбрать"><input type="checkbox" ${state.sel.has(p.id)?"checked":""} aria-label="Выбрать ${esc(p.name)}"></label>
      <span class="badge st-${p.status}">${ST[p.status]||""}</span>
      ${p.rating?`<span class="rate ${rateCls(p.rating)}">${p.rating.toFixed(1)}</span>`:""}
    </div>
    <h3>${esc(p.name)}</h3>
    <div class="c-cat">${esc(p.category)}${state.base.has(p.id)?" · в базе":""}</div>
    <div class="c-addr"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span>${esc(p.city)}${p.address?", "+esc(p.address):""}</span></div>
    <div class="c-foot">${t}${p.reviewCount?`<span class="rv-n">${p.reviewCount} ${plural(p.reviewCount,"отзыв","отзыва","отзывов")}</span>`:""}</div>
  </article>`;
}
$("#grid").addEventListener("click",e=>{
  const card=e.target.closest(".card");if(!card)return;
  const id=card.dataset.id;
  if(e.target.closest("a"))return;
  if(e.target.closest(".chk")){
    if(e.target.tagName!=="INPUT")return;
    e.target.checked?state.sel.add(id):state.sel.delete(id);
    card.classList.toggle("picked",e.target.checked);renderSelbar();return;
  }
  const p=state.view.find(x=>x.id===id);if(p)openCard(p);
});

/* ================= выбор / база / CSV ================= */
function renderSelbar(){
  const n=state.sel.size;
  $("#selbar").classList.toggle("on",n>0);
  $("#sel-n").textContent=`Выбрано ${n}`;
}
const byId=id=>state.places.find(p=>p.id===id)||state.base.get(id);
$("#sel-add").onclick=()=>{state.sel.forEach(id=>{const p=byId(id);if(p)state.base.set(id,p)});saveBase();state.sel.clear();render()};
$("#sel-del").onclick=()=>{state.sel.forEach(id=>state.base.delete(id));saveBase();state.sel.clear();render()};
$("#sel-clr").onclick=()=>{state.sel.clear();render()};
$("#sel-csv").onclick=()=>exportCSV([...state.sel].map(byId).filter(Boolean));
$("#csv").onclick=()=>exportCSV(state.view||[]);
function exportCSV(list){
  if(!list.length)return;
  const head=["Название","Категория","Город","Адрес","Телефон","Статус сайта","Сайт","Рейтинг","Отзывы","Соцсети","Ссылка"];
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const rows=list.map(p=>[p.name,p.category,p.city,p.address,p.phone,ST[p.status],p.site,p.rating,p.reviewCount,
    (p.contacts||[]).filter(c=>!["phone","email","website"].includes(c.type)).map(c=>c.url).join(" "),p.link].map(q).join(";"));
  const blob=new Blob(["\ufeff"+head.map(q).join(";")+"\n"+rows.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="leads.csv";a.click();URL.revokeObjectURL(a.href);
}

/* ================= карточка с отзывами ================= */
const dlg=$("#dlg");
function pitch(p){
  const rate=p.rating?` (${p.rating.toFixed(1)}★, ${p.reviewCount} ${plural(p.reviewCount,"отзыв","отзыва","отзывов")})`:"";
  const open=`Здравствуйте! Нашёл «${p.name}» в 2ГИС${rate}. `;
  const tail=" Могу показать пример — ответьте, если интересно.";
  return open+({
    nosite:"Заметил, что у вас нет своего сайта — клиенты, которые ищут вас в Google и 2ГИС, не видят прайс и не могут быстро записаться. Могу сделать одностраничный сайт с услугами, картой и кнопкой «Позвонить» за несколько дней.",
    socials:"Вижу, что вы ведёте соцсети, но своего сайта нет — поэтому часть клиентов из поиска вас не находит. Могу сделать сайт, который соберёт ваши услуги, цены и заявки в одном месте.",
    template:"Вижу, что сайт у вас на конструкторе. Могу переделать его под ваш бренд: быстрее, с заявками и нормальным показом в поиске.",
    site:"Посмотрел ваш сайт и вижу пару точек роста: скорость на телефоне, заявки и показ в поиске. Могу прислать короткий разбор бесплатно."
  }[p.status]||"")+tail;
}
const stars=n=>"★".repeat(n)+"☆".repeat(5-n);
async function openCard(p){
  const inBase=state.base.has(p.id);
  $("#d-in").innerHTML=`
    <button class="d-x" id="d-x" aria-label="Закрыть">✕</button>
    <div class="c-top"><span class="badge st-${p.status}">${ST[p.status]}</span>
      ${p.rating?`<span class="rate ${rateCls(p.rating)}" style="margin-left:0">${p.rating.toFixed(1)}</span>`:""}</div>
    <h2>${esc(p.name)}</h2>
    <div class="muted">${esc(p.category)} · ${esc(p.city)}${p.address?", "+esc(p.address):""}</div>
    <div class="d-sec"><h4>Контакты</h4><div class="clist">
      ${(p.contacts||[]).map(c=>`<a class="crow" href="${esc(c.url)}" target="_blank" rel="noopener"><span class="ct ct-${esc(c.type)}">${ICON[c.type]||"↗"}</span>${esc(c.text||c.url)}</a>`).join("")||'<span class="muted">Контактов в 2ГИС нет</span>'}
    </div></div>
    <div class="d-sec"><h4>Первое сообщение</h4>
      <textarea id="d-pitch">${esc(pitch(p))}</textarea>
      <div class="d-act">
        <button class="go" id="d-copy">Скопировать</button>
        <button class="btn2" id="d-base">${inBase?"Убрать из базы":"В базу"}</button>
        <a class="btn2" href="${esc(p.link)}" target="_blank" rel="noopener" style="text-decoration:none">${p.link.includes("openstreetmap")?"Открыть на карте":"Открыть в 2ГИС"}</a>
      </div></div>
    ${p.reviewCount?`<div class="d-sec"><h4>Отзывы · ${p.reviewCount}</h4><div id="d-rvs" class="muted">Загружаем…</div></div>`:""}`;
  dlg.showModal();
  $("#d-x").onclick=()=>dlg.close();
  $("#d-copy").onclick=async e=>{
    try{await navigator.clipboard.writeText($("#d-pitch").value);e.target.textContent="Скопировано"}
    catch{$("#d-pitch").select();e.target.textContent="Выделено — нажмите Ctrl+C"}
  };
  $("#d-base").onclick=e=>{
    state.base.has(p.id)?state.base.delete(p.id):state.base.set(p.id,p);
    saveBase();e.target.textContent=state.base.has(p.id)?"Убрать из базы":"В базу";render();
  };
  if(!p.reviewCount)return;
  try{
    const j=await(await fetch("/api/reviews?id="+encodeURIComponent(p.id))).json();
    $("#d-rvs").className="";
    $("#d-rvs").innerHTML=j.reviews?.length?j.reviews.map(r=>`<div class="rv"><div class="rv-t"><span>${esc(r.author||"Гость")} <span class="stars">${stars(r.rating)}</span></span><time>${esc(r.date)}</time></div><p>${esc(r.text)}</p></div>`).join(""):`<span class="muted">${esc(j.note||"Отзывов с текстом пока нет.")}</span>`;
  }catch{$("#d-rvs").textContent="Не удалось загрузить отзывы."}
}
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});

/* ================= события ================= */
function setTab(t){state.tab=t;state.status="all";state.sel.clear();render()}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$("#find").oninput=e=>{state.text=e.target.value.trim();render()};
$("#sort").onchange=e=>{state.sort=e.target.value;render()};
$("#minr").onchange=e=>{state.minr=parseFloat(e.target.value);render()};
$("#toggle-panel").onclick=()=>$("#panel").classList.toggle("open");

renderPanel();render();search();
</script>
</body>
</html>
